name: resonance-work

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-resonance}
      POSTGRES_USER: ${POSTGRES_USER:-resonance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resonance-work-password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [work]

  backend:
    build:
      context: ../..
      dockerfile: deploy/docker/backend.Dockerfile
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-resonance}:${POSTGRES_PASSWORD:-resonance-work-password}@db:5432/${POSTGRES_DB:-resonance}
      FRONTEND_URL: http://${SERVER_HOST:-localhost}:${WORK_HTTP_PORT:-8082}
      CORS_ORIGINS: http://${SERVER_HOST:-localhost}:${WORK_HTTP_PORT:-8082}
      JWT_SECRET: ${JWT_SECRET:-resonance-work-jwt-secret-change-before-sharing}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-4320}
      DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:-admin}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-adminadmin}
      RUN_MIGRATIONS_ON_STARTUP: ${RUN_MIGRATIONS_ON_STARTUP:-true}
      MATRIX_HOMESERVER: ${MATRIX_HOMESERVER:-https://matrix.example.com}
      MATRIX_USER_ID: ${MATRIX_USER_ID:-@bot:example.com}
      MATRIX_ACCESS_TOKEN: ${MATRIX_ACCESS_TOKEN:-}
      MATRIX_DEVICE_ID: ${MATRIX_DEVICE_ID:-}
      MATRIX_PASSWORD: ${MATRIX_PASSWORD:-}
      MATRIX_DM_ENABLED: "false"
      TELEGRAM_ENABLED: "false"
      KANBAN_API_BASE_URL: ${KANBAN_API_BASE_URL:-https://kanban.devds.ru/api}
      KANBAN_API_TOKEN: ${KANBAN_API_TOKEN:-}
      KANBAN_TIMEOUT_SECONDS: ${KANBAN_TIMEOUT_SECONDS:-20}
      KANBAN_BUNDLE_TASK_PAGE_SIZE: ${KANBAN_BUNDLE_TASK_PAGE_SIZE:-250}
      KANBAN_BUNDLE_CACHE_TTL_SECONDS: ${KANBAN_BUNDLE_CACHE_TTL_SECONDS:-45}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks: [work]

  frontend:
    build:
      context: ../..
      dockerfile: deploy/docker/frontend.Dockerfile
    restart: unless-stopped
    ports:
      - "${WORK_HTTP_PORT:-8082}:8080"
    volumes:
      - ./nginx.work.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    networks: [work]

networks:
  work:
    driver: bridge

volumes:
  pgdata:
